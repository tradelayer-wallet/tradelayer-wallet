[package]
name = "tl-desktop-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Testable core of the TradeLayer desktop wallet: vault session, chain-checked scan, confirm-gated send"
license = "ISC"
publish = false

[dependencies]
tl-wallet-core = { git = "https://github.com/tradelayer-wallet/TL-Extension", rev = "0f296d6310e4e4eb4d4de08744d72eee0cb934c0" }
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# Optimise only the password-hashing and cipher crates in dev/test builds so scrypt-based tests
# stay fast; release behaviour is unchanged.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.bip39]
opt-level = 3
[profile.dev.package.secp256k1-sys]
opt-level = 3
