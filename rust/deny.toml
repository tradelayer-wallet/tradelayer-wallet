# Supply-chain policy for the Rust crates under rust/ (cargo-deny 0.20).
# Audit of 2026-10-30: crates.io only, no advisories; MITNFA (hex_lit, via bitcoin) and
# CDLA-Permissive-2.0 (webpki-roots) reviewed and accepted as permissive.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
  # Both come only from Tauri's Linux backend (webkit2gtk / gtk-rs). tl-desktop ships for Windows,
  # where wry uses WebView2 and neither crate is compiled (cargo tree --target x86_64-pc-windows-msvc).
  { id = "RUSTSEC-2024-0429", reason = "glib VariantStrIter unsoundness; glib is Linux-only here" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; reached only via gtk3-macros (Linux)" },
]

[licenses]
version = 2
allow = [
  "MIT", "MITNFA", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# MPL-2.0 (file-level copyleft) only for these unmodified Tauri dependencies: Servo's CSS parser
# stack via tauri-utils, and option-ext via dirs. Any change to their files would be MPL-2.0.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
]

[licenses.private]
# First-party crates are publish = false; their licence follows the repository.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# First-party crates from the same GitHub org, pinned by rev in Cargo.toml (TL-Extension tl-wallet-core,
# tl-rpc tl-rpc-client).
allow-org = { github = ["tradelayer-wallet"] }
