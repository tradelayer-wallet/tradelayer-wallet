<div class="algo-page">
  <header class="header">
    <h1 class="title">Hourly Top Picks</h1>
    <span class="badge">Updated hourly</span>
    <div class="spacer"></div>
    <label class="upload-btn">
      <input type="file" accept=".js,.mjs,.ts" (change)="onUploadFile($event.target as HTMLInputElement)" />
      Upload Strategy
    </label>
  </header>

  <nav class="tabs">
    <button *ngFor="let t of tabs"
            [class.active]="activeTab===t.key"
            (click)="setTab(t.key)">{{ t.label }}</button>
  </nav>

  <section class="filters">
    <div class="row">
      <label>
        <span>Market:</span>
        <select [formControl]="filters.controls.market">
          <option>All</option>
          <option>BTC</option>
          <option>ETH</option>
          <option>LTC</option>
          <option>Others</option>
        </select>
      </label>
      <label>
        <span>Running Time:</span>
        <select [formControl]="filters.controls.runningTime">
          <option>All</option>
          <option>1–7 days</option>
          <option>7–30 days</option>
          <option>> 30 days</option>
        </select>
      </label>
      <label>
        <span>ROI:</span>
        <select [formControl]="filters.controls.roi">
          <option>All</option>
          <option>> 100%</option>
          <option>10% – 100%</option>
          <option>< 10%</option>
        </select>
      </label>
      <label>
        <span>Categories:</span>
        <select [formControl]="filters.controls.category">
          <option>All</option>
          <option>Grid</option>
          <option>Martingale</option>
          <option>Combo</option>
        </select>
      </label>
      <button class="reset" type="button" (click)="filters.reset({market:'All',runningTime:'All',roi:'All',category:'All',sort:filters.value.sort||'Recommended'})">
        Reset
      </button>
      <div class="sort">
        <span>Rank by:</span>
        <select [formControl]="filters.controls.sort">
          <option>Recommended</option>
          <option>ROI</option>
          <option>P&L</option>
          <option>Copiers</option>
          <option>Running Time</option>
        </select>
      </div>
    </div>
  </section>

  <section class="table">
    <div class="thead">
      <div>Ranking</div>
      <div>Market</div>
      <div>ROI</div>
      <div>P&amp;L (USD)</div>
      <div>Copiers</div>
      <div>Running Time</div>
      <div class="action-col">Action</div>
    </div>

    <div class="tbody">
      <div class="row" *ngFor="let r of rows">
        <div class="rank">
          <span class="medal" [class.gold]="r.rank===1" [class.silver]="r.rank===2" [class.bronze]="r.rank===3">{{ r.rank }}</span>
        </div>
        <div class="market">
          <div class="pair">{{ r.market }}</div>
          <div class="mode">
            {{ r.mode }}
            <span *ngIf="r.leverage" class="lev">{{ r.leverage }}</span>
          </div>
        </div>
        <div class="roi" [class.positive]="r.roiPct>=0" [class.negative]="r.roiPct<0">{{ r.roiPct | number:'1.2-2' }}%</div>
        <div class="pnl">{{ r.pnlUsd | number:'1.2-2' }}</div>
        <div class="copiers">{{ r.copiers | number }}</div>
        <div class="runtime">{{ r.runtime }}</div>
        <div class="action">
          <button class="copy" (click)="onCopy(r)">Copy For Free</button>
        </div>
      </div>
    </div>
  </section>
</div>
