<tl-side-nav (keydown.shift.t)="openHiddenTerminal()">
    <tl-layout>
        <ng-container *ngIf="isNetworkSelected; else startupShell">
            <router-outlet></router-outlet>
        </ng-container>
        <ng-template #startupShell>
            <div class="startup-shell">
                <div class="startup-shell-card">
                    <div class="startup-shell-kicker">TradeLayer Wallet</div>
                    <div class="startup-shell-title">Warming up services</div>
                    <div class="startup-shell-copy">
                        Waiting for network selection and wallet RPC to finish attaching.
                    </div>
                    <mat-spinner diameter="44"></mat-spinner>
                </div>
            </div>
        </ng-template>
    </tl-layout>
    <ng-container>
        <ng-template *ngFor='let w of windows' [ngComponentOutlet]="w.component"></ng-template>
        <tl-info-line></tl-info-line>
    </ng-container>
</tl-side-nav>

<tl-disconnected-line *ngIf="!allConnected"></tl-disconnected-line>
<overlay-loading *ngIf='isLoading || socketsLoading'></overlay-loading>
