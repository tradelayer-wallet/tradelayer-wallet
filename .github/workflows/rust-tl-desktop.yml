name: Rust tl-desktop
on:
  pull_request:
    paths: ['rust/tl-desktop/**', 'rust/tl-desktop-core/**', 'rust/tl-wallet-service/**', 'packages/wallet-fe/**', '.github/workflows/rust-tl-desktop.yml']
  push:
    branches: [master, feat/rust-port]
    paths: ['rust/tl-desktop/**', 'rust/tl-desktop-core/**', 'rust/tl-wallet-service/**', 'packages/wallet-fe/**', '.github/workflows/rust-tl-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # all branches: the UI is built from origin/FE-speed (scripts/build-ui.mjs --ref)
          fetch-depth: 0
      - name: Check out BitcornWisdom at the pinned chart commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: patrickdugan/BitcornWisdom
          ref: 2cbef833fc11b5b66f72257728365e5f794a32e1
          path: _bitcornwisdom
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Install pinned Node.js (the UI build is verified on Node 24)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - name: Build the FE-speed UI with the skin layer into dist-ui-fe-speed-skin (lifecycle scripts disabled)
        working-directory: rust/tl-desktop
        env:
          BITCORN_WISDOM_DIR: ${{ github.workspace }}/_bitcornwisdom
        shell: bash
        # Job logs need a GitHub sign-in; the tail of a failed build is also emitted as a (public) annotation.
        run: |
          set -o pipefail
          node scripts/build-ui.mjs --ref origin/FE-speed --name fe-speed --skin fe-speed-skin "${{ runner.temp }}/ui-build" 2>&1 | tee "$RUNNER_TEMP/build-ui.log" || {
            echo "::error title=build-ui failed::$(tail -n 40 "$RUNNER_TEMP/build-ui.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          }
      - name: Fetch pinned crates
        working-directory: rust/tl-desktop
        run: cargo fetch --locked
      - name: Unit tests
        working-directory: rust/tl-desktop
        run: cargo test --locked --offline
      - name: Clippy
        working-directory: rust/tl-desktop
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Format
        working-directory: rust/tl-desktop
        run: cargo fmt --all -- --check
      - name: Release build
        working-directory: rust/tl-desktop
        run: cargo build --locked --offline --release
  installer:
    # The per-user NSIS installer from the same UI build, uploaded as an artifact. Unsigned: no
    # code-signing certificate is configured.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out BitcornWisdom at the pinned chart commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: patrickdugan/BitcornWisdom
          ref: 2cbef833fc11b5b66f72257728365e5f794a32e1
          path: _bitcornwisdom
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install pinned Node.js (the UI build is verified on Node 24)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - name: Build the FE-speed UI with the skin layer into dist-ui-fe-speed-skin (lifecycle scripts disabled)
        working-directory: rust/tl-desktop
        env:
          BITCORN_WISDOM_DIR: ${{ github.workspace }}/_bitcornwisdom
        shell: bash
        # Job logs need a GitHub sign-in; the tail of a failed build is also emitted as a (public) annotation.
        run: |
          set -o pipefail
          node scripts/build-ui.mjs --ref origin/FE-speed --name fe-speed --skin fe-speed-skin "${{ runner.temp }}/ui-build" 2>&1 | tee "$RUNNER_TEMP/build-ui.log" || {
            echo "::error title=build-ui failed::$(tail -n 40 "$RUNNER_TEMP/build-ui.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          }
      - name: Install pinned tauri-cli
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build the NSIS installer
        working-directory: rust/tl-desktop
        run: cargo tauri build --bundles nsis --ci -- --locked
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tl-desktop-installer
          path: rust/tl-desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
