name: Rust tl-desktop
on:
  pull_request:
    paths: ['rust/tl-desktop/**', 'rust/tl-desktop-core/**', 'rust/tl-wallet-service/**', 'packages/wallet-fe/**', '.github/workflows/rust-tl-desktop.yml']
  push:
    branches: [master, feat/rust-port]
    paths: ['rust/tl-desktop/**', 'rust/tl-desktop-core/**', 'rust/tl-wallet-service/**', 'packages/wallet-fe/**', '.github/workflows/rust-tl-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # all branches: the UI is built from origin/FE-speed (scripts/build-ui.mjs --ref)
          fetch-depth: 0
      - name: Check out BitcornWisdom at the pinned chart commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: patrickdugan/BitcornWisdom
          ref: 2cbef833fc11b5b66f72257728365e5f794a32e1
          path: _bitcornwisdom
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Build the FE-speed UI with the skin layer into dist-ui-fe-speed-skin (lifecycle scripts disabled)
        working-directory: rust/tl-desktop
        env:
          BITCORN_WISDOM_DIR: ${{ github.workspace }}/_bitcornwisdom
        run: node scripts/build-ui.mjs --ref origin/FE-speed --name fe-speed --skin fe-speed-skin "${{ runner.temp }}/ui-build"
      - name: Fetch pinned crates
        working-directory: rust/tl-desktop
        run: cargo fetch --locked
      - name: Unit tests
        working-directory: rust/tl-desktop
        run: cargo test --locked --offline
      - name: Clippy
        working-directory: rust/tl-desktop
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Format
        working-directory: rust/tl-desktop
        run: cargo fmt --all -- --check
      - name: Release build
        working-directory: rust/tl-desktop
        run: cargo build --locked --offline --release
